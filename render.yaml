# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repo.
services:
  - type: web
    name: bowfall
    runtime: node
    plan: free
    region: frankfurt   # closest to the UK and Europe; others: oregon, ohio, virginia, singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # the Postgres connection string from Neon (or any Postgres); Render asks for it when you apply the blueprint
      - key: DATABASE_URL
        sync: false
      # optional: the name of the one admin account (Tom if not set)
      - key: ADMIN_NAME
        sync: false
      # optional sign-in with Google and Discord (see HOSTING.md); leave blank to hide the buttons
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
