<style>
  :root {

      if (p.d && !(p.f > 0)) continue;
      const r = (p.rz || 16) * (p.f > 0 ? Math.max(0.2, 1 - p.f) : 1);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.arc(p.x + 3, p.y + 5, r, 0, 7); g.fill();
      g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.beginPath(); g.arc(p.x, p.y, r + 7, p.a - 1, p.a + 1); g.stroke();
      if (p.dr) { g.strokeStyle = '#ffffff'; g.globalAlpha = 0.5; g.lineWidth = 2; g.beginPath(); g.moveTo(p.x + Math.cos(p.a) * (r + 7 - 14 * p.ch), p.y + Math.sin(p.a) * (r + 7 - 14 * p.ch)); g.lineTo(p.x + Math.cos(p.a) * (r + 60), p.y + Math.sin(p.a) * (r + 60)); g.stroke(); g.globalAlpha = 1; }
      if (!p.d) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(p.x - 24, p.y - r - 18, 48, 8); g.fillStyle = p.tm === 'red' ? '#ff5a45' : '#3f8cff'; g.fillRect(p.x - 24, p.y - r - 18, 48 * Math.max(0, p.hp / (p.mh || 100)), 8); }
    }
    g.textAlign = 'center'; g.font = "700 64px 'Rajdhani', 'Arial Narrow', sans-serif";
    pops = pops.filter(o => (o.t -= 1 / 60) > 0);
    for (const o of pops) { g.globalAlpha = Math.min(1, o.t); g.fillStyle = '#ffcf5a'; g.fillText(['pit', 'lava', 'water', 'spikes', 'saw'].includes(o.c) ? 'RING OUT' : 'KNOCKOUT', o.x, o.y - 40 - (1.2 - o.t) * 60); }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(470, 12, 260, 76);
    g.font = "700 60px 'Rajdhani', 'Arial Narrow', sans-serif"; g.fillStyle = '#ff5a45'; g.fillText(v.m.wr, 545, 72); g.fillStyle = '#3f8cff'; g.fillText(v.m.wb, 655, 72); g.fillStyle = '#eef3e6'; g.fillText(':', 600, 68);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

async function route() {
  const h = (location.hash || '#/').slice(1).split('?')[0];
  const parts = h.split('/').filter(Boolean);
  document.querySelectorAll('#nav a[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === parts[0] || (a.dataset.r === 'forum' && parts[0] === 'forum')));
  app.innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (!parts.length) await pages.home();
    else if (parts[0] === 'servers') await pages.servers();
    else if (parts[0] === 'leaderboard') await pages.leaderboard(parts[1]);
    else if (parts[0] === 'u' && parts[1]) await pages.user(decodeURIComponent(parts[1]));
    else if (parts[0] === 'forum' && parts[1] === 'c') await pages.cat(parts[2]);
    else if (parts[0] === 'forum' && parts[1] === 't') await pages.thread(+parts[2]);
    else if (parts[0] === 'forum') await pages.forum();
    else if (parts[0] === 'login' || parts[0] === 'register') await pages.auth(parts[0]);
    else if (parts[0] === 'finish') await pages.finish();
    else if (parts[0] === 'forgot') await pages.forgot();
    else if (parts[0] === 'reset') await pages.reset();
    else if (parts[0] === 'privacy' || parts[0] === 'terms') await pages.legal(parts[0]);
    else app.innerHTML = '<div class="card empty">Page not found. <a href="#/">Home</a></div>';
    document.title = 'Bowfall' + (parts[0] ? ' · ' + ({ servers: 'Games', leaderboard: 'Leaderboard', forum: 'Forum', u: parts[1], login: 'Sign in', register: 'Create account', forgot: 'Forgot password', reset: 'New password', privacy: 'Privacy', terms: 'Terms' }[parts[0]] || '') : '');
  } catch (e) { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
// an invite link (?ref=name): remembered for 30 days, so the account made later counts as theirs
(() => { const r = new URLSearchParams(location.search).get('ref'); if (r && /^[A-Za-z0-9_-]{3,16}$/.test(r)) { try { localStorage.setItem('bowfall-ref', r); } catch (e) {} document.cookie = 'bf_ref=' + encodeURIComponent(r) + '; Path=/; Max-Age=2592000; SameSite=Lax'; } })();
function refName() { try { return localStorage.getItem('bowfall-ref') || undefined; } catch (e) { return undefined; } }
// the community Discord, when the server has its invite link
fetch('/api/legal').then(r => r.json()).then(d => { if (d && d.discord) for (const id of ['navDiscord', 'footDiscord']) { const a = document.getElementById(id); a.href = d.discord; a.hidden = false; } }).catch(() => {});
loadMe().then(route);
})();
