<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bowfall</title>
<meta name="description" content="Bowfall: team knockback archery in your browser. Pick an element and a role, knock the other team into the lava.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #0f1a12; --bg2: #152419; --panel: #1a2c1f; --panel2: #213728; --line: #33503a; --text: #eef3e6; --muted: #9fb39c;
    --gold: #ffc94a; --gold2: #ffdd85; --red: #ff5a45; --blue: #3d8bff; --ok: #7ddc7a; --bad: #ff6b6b;
    --display: 'Rajdhani', 'Arial Narrow', sans-serif; --body: 'Titillium Web', 'Segoe UI', sans-serif; --notch: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--body); min-height: 100vh; }
  body { background-image: linear-gradient(135deg, rgba(255,255,255,.015) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.015) 50%, rgba(255,255,255,.015) 75%, transparent 75%); background-size: 8px 8px; }
  a { color: var(--gold2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; letter-spacing: .01em; }
  h1 { text-transform: uppercase; }
  h1 { font-size: clamp(38px, 7vw, 72px); }
  h2 { font-size: 28px; }
  h3 { font-size: 20px; }
  .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,26,18,.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 18px; height: 60px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 700 24px var(--display); color: var(--text); }
  .logo:hover { text-decoration: none; }
  .logo svg { width: 30px; height: 30px; }
  nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
  nav a { color: var(--muted); padding: 8px 12px; border-radius: 2px; font: 600 15px var(--display); white-space: nowrap; }
  nav a:hover, nav a.on { color: var(--text); background: var(--panel); text-decoration: none; }
  .who { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--display); color: #221a08; background: var(--gold); border: 0; border-radius: 0; padding: 10px 20px; cursor: pointer; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px)); text-transform: uppercase; letter-spacing: .03em; }
  .btn:hover { background: var(--gold2); text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn.big { font-size: 22px; padding: 14px 30px; border-radius: 2px; }
  .btn.alt { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.alt:hover { background: #29422f; }
  .btn.small { font-size: 14px; padding: 6px 12px; border-radius: 2px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  main { padding: 28px 0 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 20px; clip-path: var(--notch); }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: center; padding: 20px 0 36px; }
  .hero p { font-size: 19px; color: #d7e2cf; max-width: 560px; }
  .hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .hero canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 2px; border: 1px solid var(--line); background: #5a8a3a; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 2px; font: 600 13px var(--body); background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .pill.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .muted { color: var(--muted); }
  .feat h3 { margin-bottom: 6px; }
  .feat .ic { font-size: 28px; line-height: 1; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font: 600 13px var(--body); color: var(--muted); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .tabs button { font: 600 14px var(--display); color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 7px 14px; border-radius: 2px; cursor: pointer; }
  .tabs button.on { color: #221a08; background: var(--gold); border-color: var(--gold); }
  form.stack { display: flex; flex-direction: column; gap: 12px; }
  label { font: 600 14px var(--body); color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  input, textarea, select { font: 400 16px var(--body); color: var(--text); background: #0f1a12; border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 130px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .err { color: var(--bad); font-weight: 600; min-height: 1.2em; }
  form.stack .err { margin: 0; }
  form.stack .err:empty { display: none; }
  .prov { display: flex; flex-direction: column; gap: 8px; }
  .prov a { display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 16px var(--display); padding: 11px 16px; border-radius: 2px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); }
  .prov a:hover { background: #29422f; text-decoration: none; }
  .prov svg { width: 20px; height: 20px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin: 14px 0; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .methods { display: flex; flex-direction: column; gap: 8px; }
  .methods > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 2px; }
  .narrow { max-width: 440px; margin: 0 auto; }
  .crumbs { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .cat { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .cat h3 a { color: var(--text); }
  .thread-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .thread-row .t { font: 600 17px var(--display); color: var(--text); }
  .tag { display: inline-block; font: 600 11px var(--body); padding: 1px 7px; border-radius: 2px; background: var(--panel2); color: var(--gold); border: 1px solid var(--line); vertical-align: 2px; margin-left: 6px; }
  .tag.admin { color: #ffb4a8; }
  .post { display: grid; grid-template-columns: 160px 1fr; gap: 16px; }
  .post .by { border-right: 1px solid var(--line); padding-right: 14px; }
  .post .by b { font: 700 17px var(--display); display: block; }
  .post .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .post .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .post.deleted .body { color: var(--muted); font-style: italic; }
  .linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font: 600 13px var(--body); padding: 0; }
  .linkbtn:hover { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 2px; padding: 12px; }
  .stat b { display: block; font: 700 26px var(--display); font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .ach { background: var(--panel2); border: 1px solid var(--line); border-radius: 2px; padding: 12px; opacity: .6; }
  .ach.got { opacity: 1; border-color: var(--gold); }
  .ach b { font: 700 16px var(--display); }
  .ach .bar { height: 6px; background: #0f1a12; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .ach .bar i { display: block; height: 100%; background: var(--gold); }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bars div { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: 14px; }
  .bars i { display: block; height: 10px; border-radius: 2px; background: var(--gold); }
  .srv td:first-child b { font: 600 17px var(--display); }
  .lock { color: var(--gold); }
  footer { border-top: 1px solid var(--line); padding: 22px 0; color: var(--muted); font-size: 14px; }
  .flag { width: 20px; height: 15px; vertical-align: -2px; margin-right: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .rkb { display: inline-flex; align-items: flex-start; justify-content: center; min-width: 20px; height: 19px; padding: 1px 3px 0; margin-right: 7px; vertical-align: -3px;
    font: 700 12px/14px var(--display); color: #11141a; background: var(--rc); clip-path: polygon(0 0, 100% 0, 100% 68%, 50% 100%, 0 68%); }
  .rkb.big { min-width: 36px; height: 38px; font-size: 20px; line-height: 24px; padding-top: 3px; margin-right: 12px; }
  .xp { height: 8px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; overflow: hidden; }
  .xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .tabs.sm button { font-size: 13px; padding: 5px 11px; }
  .hs { display: flex; flex-direction: column; gap: 6px; }
  .hs > div { display: grid; grid-template-columns: 22px minmax(120px, 1.2fr) 1fr 56px; gap: 8px; align-items: center; font-size: 14px; }
  .hs i { display: block; height: 10px; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  .hs b { text-align: right; font-variant-numeric: tabular-nums; }
  .section-h { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 34px 0 14px; }
  @media (max-width: 800px) {
    .hero { grid-template-columns: 1fr; }
    .post { grid-template-columns: 1fr; }
    .post .by { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 8px; }
    header .wrap { gap: 10px; }
    .logo span { display: none; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#/" aria-label="Bowfall home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#ffc94a"/><path d="M9 7c9 3 13 9 13 18" stroke="#221a08" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M9 7l13 18" stroke="#221a08" stroke-width="1.5"/><path d="M6 20l14-8" stroke="#ff5a45" stroke-width="2.5" stroke-linecap="round"/><path d="M20 12l-4 .5 1.5 3z" fill="#ff5a45"/></svg>
      <span>Bowfall</span>
    </a>
    <nav id="nav">
      <a href="/play">Play</a>
      <a href="#/servers" data-r="servers">Servers</a>
      <a href="#/leaderboard" data-r="leaderboard">Leaderboard</a>
      <a href="#/forum" data-r="forum">Forum</a>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer><div class="wrap">Bowfall · team knockback archery · <a href="/play">Play now</a> · <span id="ver"></span></div></footer>

<script src="sim.js"></script>
<script>
(() => {
const Sim = window.BowSim;
document.getElementById('ver').textContent = 'Version ' + Sim.VERSION;
const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { if (!t) return ''; const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago'; return new Date(t).toLocaleDateString(); };
const titleName = k => (k && Sim.ACHIEVEMENTS[k] ? Sim.ACHIEVEMENTS[k].title : '');
let regionNames = null;
const regionName = cc => { try { regionNames = regionNames || new Intl.DisplayNames(['en'], { type: 'region' }); return regionNames.of(cc.toUpperCase()); } catch (e) { return cc.toUpperCase(); } };
const flag = cc => (/^[a-z]{2}$/.test(cc || '') ? `<img class="flag" src="https://flagcdn.com/20x15/${cc}.png" width="20" height="15" alt="${cc.toUpperCase()}" title="${esc(regionName(cc))}">` : '');
document.addEventListener('error', e => { const t = e.target; if (t && t.classList && t.classList.contains('flag')) t.remove(); }, true);
const RANKS = [[1, 'Recruit', '#a8835a'], [5, 'Bronze', '#cd8a4e'], [10, 'Silver', '#c9d1dc'], [15, 'Gold', '#f2c14e'], [20, 'Platinum', '#7fe0d8'], [30, 'Diamond', '#9fb8ff'], [45, 'Master', '#ff6a8a']];
const rankOf = lv => { let r = RANKS[0]; for (const x of RANKS) if (lv >= x[0]) r = x; return { name: r[1], col: r[2] }; };
const badge = (lv, big) => (lv ? `<span class="rkb${big ? ' big' : ''}" style="--rc:${rankOf(lv).col}" title="${rankOf(lv).name} · level ${lv}">${lv}</span>` : '');
// every two-letter region the browser knows a name for, for the flag picker
const COUNTRIES = (() => { const out = []; const A = 'abcdefghijklmnopqrstuvwxyz'; for (const a of A) for (const b of A) { const cc = a + b, n = regionName(cc); if (n && n.toUpperCase() !== cc.toUpperCase() && !/unknown/i.test(n) && !/^(q.|x.|zz|ez|un|eu|aa)$/.test(cc)) out.push([cc, n]); } return out.sort((x, y) => x[1].localeCompare(y[1])); })();
async function api(path, body) {
  const r = await fetch('/api' + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin' });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
let me = null, providers = null;
const ICONS = {
  google: '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>',
  discord: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#5865F2" d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.5 0L8.7 3a19.7 19.7 0 0 0-4.9 1.4C.7 9 0 13.6.3 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.4-5.2-.7-9.7-3.3-13.7zM8.5 15.4c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4z"/></svg>',
};
async function getProviders() { if (!providers) providers = (await api('/auth-providers').catch(() => ({ providers: [] }))).providers; return providers; }
const qs = () => new URLSearchParams(location.hash.split('?')[1] || '');
async function loadMe() { try { me = (await api('/me')).user; } catch (e) { me = null; } drawWho(); }
function drawWho() {
  $('who').innerHTML = me
    ? `<a href="#/u/${esc(me.name)}" class="btn alt small">${esc(me.name)}</a><button class="btn alt small" id="outBtn" type="button">Sign out</button>`
    : `<a href="#/login" class="btn alt small">Sign in</a><a href="#/register" class="btn small hide-sm">Create account</a>`;
  const o = $('outBtn'); if (o) o.onclick = async () => { await api('/logout', {}); me = null; drawWho(); go('#/'); };
}
const go = h => { if (location.hash === h) route(); else location.hash = h; };

// ---------- pages ----------
const pages = {
  async home() {
    const [rooms, forum] = await Promise.all([api('/rooms').catch(() => ({ rooms: [], online: 0 })), api('/forum').catch(() => ({ recent: [] }))]);
    app.innerHTML = `
      <section class="hero">
        <div>
          <span class="pill live">${rooms.online} playing now</span>
          <h1 style="margin:14px 0 12px">Knock them<br>into the lava.</h1>
          <p>Bowfall is team archery where knockback is the weapon. Pick an element and a role, draw your bow and send the other team flying into pits, spikes and each other. Up to 4 a side, bots welcome.</p>
          <div class="cta"><a class="btn big" href="/play">Play now</a><a class="btn alt big" href="#/servers">Find a game</a></div>
        </div>
        <canvas id="heroCv" width="600" height="400" aria-label="An archer knocking another into a pit"></canvas>
      </section>
      <div class="grid g3">
        <div class="card feat" style="border-top:4px solid var(--gold)"><h3>Draw, aim, launch</h3><p class="muted">Hold to draw, release to fire. Fuller draws fly faster and hit harder. Land a bullseye for a critical hit.</p></div>
        <div class="card feat" style="border-top:4px solid var(--red)"><h3>${Object.keys(Sim.ELEMENTS).length} elements, ${Object.keys(Sim.ROLES).length} roles</h3><p class="muted">${Object.values(Sim.ELEMENTS).map(e => e.name).join(', ')}. Mix one with a role like Ninja or Juggernaut and build it up between rounds.</p></div>
        <div class="card feat" style="border-top:4px solid var(--blue)"><h3>Climb the board</h3><p class="muted">Sign in to keep your wins, knockouts and achievements, and wear the titles you earn.</p></div>
      </div>
      <div class="grid g2" style="margin-top:16px">
        <div class="card"><div class="section-h" style="margin-top:0"><h2>Open games</h2><a href="#/servers">All games</a></div>${roomTable(rooms.rooms.slice(0, 5), true)}</div>
        <div class="card"><div class="section-h" style="margin-top:0"><h2>From the forum</h2><a href="#/forum">Forum</a></div>${threadList(forum.recent || [], true)}</div>
      </div>`;
    heroArt($('heroCv'));
  },
  async servers() {
    const d = await api('/rooms');
    app.innerHTML = `
      <div class="section-h" style="margin-top:0"><div><h1 style="font-size:40px">Games</h1><p class="muted" style="margin:6px 0 0">Public games on this server. Private games don't show here; join those with their code.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="/play#create">Host a game</a><a class="btn alt" href="/play">Join with a code</a></div></div>
      <div class="card srv">${roomTable(d.rooms, false)}</div>`;
    clearInterval(pages._t); pages._t = setInterval(() => { if (location.hash.startsWith('#/servers')) pages.servers(); else clearInterval(pages._t); }, 6000);
  },
  async leaderboard(by) {
    by = by || 'elo';
    const role = by === 'role' ? (qs().get('r') || 'sniper') : null;
    const L = { elo: 'Rating', wins: 'Game wins', kills: 'Knockouts', matchWins: 'Match wins', games: 'Games played', ring: 'Ring-outs', bull: 'Bullseyes' };
    const [d, hs] = await Promise.all([api('/leaderboard?by=' + (role ? 'elo&role=' + role : by)), by === 'records' ? api('/highscores') : null]);
    const tabs = `<div class="tabs">${Object.entries(L).map(([k, v]) => `<button type="button" data-by="${k}" class="${k === by ? 'on' : ''}">${v}</button>`).join('')}<button type="button" data-by="role" class="${role ? 'on' : ''}">By role</button><button type="button" data-by="records" class="${by === 'records' ? 'on' : ''}">Highscores</button></div>`;
    const who = r => `${badge(r.level)}${flag(r.country)}<a href="#/u/${esc(r.name)}"><b>${esc(r.name)}</b></a>${r.ai ? '<span class="tag" title="An AI player: fills matchmaking games when nobody close to your rating is searching">AI</span>' : ''}${r.title ? `<span class="tag">${esc(titleName(r.title))}</span>` : ''}`;
    let body;
    if (by === 'records') {
      const board = (title, list, unit) => { const max = list.length ? list[0].value : 1;

// a little scene for the front page: an archer's arrow knocking another toward a pit
function heroArt(cv) {
  const g = cv.getContext('2d'); let t0 = performance.now();
  const frame = now => {
    if (!document.body.contains(cv)) return;
    const t = ((now - t0) / 1000) % 3.2;
    g.fillStyle = '#5a8a3a'; g.fillRect(0, 0, 600, 400);
    for (let i = 0; i < 40; i++) { g.fillStyle = i % 2 ? 'rgba(122,170,80,.25)' : 'rgba(55,95,35,.25)'; g.beginPath(); g.arc((i * 137) % 600, (i * 89) % 400, 30 + (i % 5) * 8, 0, 7); g.fill(); }
    g.fillStyle = '#1c130b'; g.fillRect(430, 150, 120, 110); g.fillStyle = '#030202'; g.fillRect(440, 160, 100, 90);
    g.fillStyle = '#ff5a45'; g.beginPath(); g.arc(110, 205, 22, 0, 7); g.fill(); g.strokeStyle = '#c89b5b'; g.lineWidth = 4; g.beginPath(); g.arc(122, 205, 26, -1, 1); g.stroke();
    const ax = t < 0.8 ? 140 + t / 0.8 * 180 : -100;
    if (ax > 0) { g.strokeStyle = '#d8c7a0'; g.lineWidth = 3; g.beginPath(); g.moveTo(ax - 30, 205); g.lineTo(ax, 205); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(ax + 8, 205); g.lineTo(ax, 200); g.lineTo(ax, 210); g.fill(); }
    let bx = 330, sc = 1;
    if (t > 0.8) { const k = Math.min(1, (t - 0.8) / 0.9); bx = 330 + k * 160; if (k >= 1) sc = Math.max(0, 1 - (t - 1.7) / 0.5); }
    if (sc > 0) { g.save(); g.translate(bx, 205); g.scale(sc, sc); g.rotate(t > 1.7 ? (t - 1.7) * 8 : 0); g.fillStyle = '#3d8bff'; g.beginPath(); g.arc(0, 0, 22, 0, 7); g.fill(); g.restore(); }
    if (t > 0.8 && t < 1.1) { g.fillStyle = 'rgba(255,255,255,.8)'; g.font = '700 26px Fredoka, sans-serif'; g.fillText('12', 320, 170 - (t - 0.8) * 60); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

    if (!parts.length) await pages.home();
    else if (parts[0] === 'servers') await pages.servers();
    else if (parts[0] === 'leaderboard') await pages.leaderboard(parts[1]);
    else if (parts[0] === 'u' && parts[1]) await pages.user(decodeURIComponent(parts[1]));
    else if (parts[0] === 'forum' && parts[1] === 'c') await pages.cat(parts[2]);
    else if (parts[0] === 'forum' && parts[1] === 't') await pages.thread(+parts[2]);
    else if (parts[0] === 'forum') await pages.forum();
    else if (parts[0] === 'login' || parts[0] === 'register') await pages.auth(parts[0]);
    else if (parts[0] === 'finish') await pages.finish();
    else app.innerHTML = '<div class="card empty">Page not found. <a href="#/">Home</a></div>';
    document.title = 'Bowfall' + (parts[0] ? ' · ' + ({ servers: 'Games', leaderboard: 'Leaderboard', forum: 'Forum', u: parts[1], login: 'Sign in', register: 'Create account' }[parts[0]] || '') : '');
  } catch (e) { app.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
loadMe().then(route);
})();
</script>
